<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>頭城小知識｜內容管理</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#102a3b;--sea:#0b5068;--sand:#f7f2e9;--paper:#fffdfa;--line:#d9d4ca;--coral:#dc6040}*{box-sizing:border-box}body{margin:0;background:var(--sand);color:var(--ink);font-family:"Noto Sans TC",sans-serif}.wrap{max-width:1120px;margin:auto;padding:30px 22px 70px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:20px;margin-bottom:28px}.top a{color:var(--sea);text-decoration:none}.top h1{font-size:1.35rem;margin:0}.sub{font-size:.82rem;color:#63727a;margin-top:4px}.login{max-width:420px;margin:13vh auto;background:var(--paper);padding:35px;border:1px solid var(--line)}h2{margin-top:0}label{font-weight:700;font-size:.9rem;display:block;margin:16px 0 6px}input,select,textarea{font:inherit;width:100%;border:1px solid var(--line);background:#fff;padding:10px;border-radius:5px;color:var(--ink)}textarea{min-height:132px;resize:vertical}.hint{font-size:.8rem;color:#65747b}.btn{border:0;background:var(--sea);color:#fff;padding:10px 16px;border-radius:5px;font:inherit;font-weight:700;cursor:pointer}.btn.secondary{background:transparent;color:var(--sea);border:1px solid var(--sea)}.btn.danger{color:#b23028;background:transparent;border:1px solid #d9aaa5}.toolbar{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:18px}.layout{display:grid;grid-template-columns:1.05fr .95fr;gap:24px}.panel{background:var(--paper);border:1px solid var(--line);padding:22px}.list{padding:0;margin:0;list-style:none}.item{border-bottom:1px solid var(--line);padding:13px 2px;cursor:pointer}.item:last-child{border-bottom:0}.item:hover,.item.selected{background:#e6f1ee}.item b,.item small{display:block}.item small{color:#68767b;margin-top:3px}.row{display:flex;gap:10px}.row>*{flex:1}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.status{min-height:22px;font-size:.86rem;margin:12px 0}.status.error{color:#ae2e26}.status.ok{color:#08744b}.setup{border-left:4px solid var(--coral);background:#fff0e9;padding:14px;margin-bottom:18px}.hidden{display:none!important}@media(max-width:760px){.layout{grid-template-columns:1fr}.wrap{padding:20px 14px}.login{margin:7vh auto}.toolbar{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body><main class="wrap">
  <header class="top"><div><h1>頭城小知識 · 內容管理</h1><div class="sub">新增、編輯與發布前台故事</div></div><a href="./index.html">查看公開網站 ↗</a></header>
  <section id="setup" class="setup hidden">請先在 <code>supabase-config.js</code> 填入 Supabase 專案資訊，再重新整理本頁。</section>
  <section id="login" class="login"><h2>管理者登入</h2><p class="hint">請使用已建立的管理帳號登入。</p><label>Email</label><input id="email" type="email" autocomplete="email"><label>密碼</label><input id="password" type="password" autocomplete="current-password"><div id="loginStatus" class="status"></div><button id="loginButton" class="btn">登入後台</button></section>
  <section id="app" class="hidden"><div class="toolbar"><div><b id="userEmail"></b><div class="hint">可直接選取左側內容進行編輯。</div></div><div><button id="newButton" class="btn">＋ 新增故事</button> <button id="logoutButton" class="btn secondary">登出</button></div></div><div class="layout"><aside class="panel"><b>所有故事</b><ul id="storyList" class="list"></ul></aside><section class="panel"><h2 id="formTitle">新增故事</h2><form id="storyForm"><input id="storyId" type="hidden"><div class="row"><div><label>分類</label><select id="category"><option>地理與交通</option><option>生活與日常</option><option>人文與地方</option><option>歷史與記憶</option></select></div><div><label>排序</label><input id="sortOrder" type="number" min="1" value="1"></div></div><label>標題</label><input id="title" required maxlength="100"><label>內容</label><textarea id="content" required></textarea><label>延伸清單（每行一項，可留白）</label><textarea id="listItems" placeholder="石城\n大里\n大溪"></textarea><label><input id="published" type="checkbox" checked style="width:auto"> 發布到公開網站</label><div id="formStatus" class="status"></div><div class="actions"><button class="btn" type="submit">儲存變更</button><button id="deleteButton" class="btn danger hidden" type="button">刪除故事</button></div></form></section></div></section>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./supabase-config.js"></script><script src="./admin.js"></script></body></html>
