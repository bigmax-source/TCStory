<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#092c42">
  <title>頭城小知識｜沿海生活誌</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#102a3b;--sea:#0b5068;--aqua:#bde5df;--coral:#ee704c;--sand:#f7f2e9;--paper:#fffdfa;--line:rgba(16,42,59,.13)}
    *{box-sizing:border-box} html{scroll-behavior:smooth} body{margin:0;background:var(--sand);color:var(--ink);font-family:"Noto Sans TC",sans-serif;line-height:1.65}.shell{max-width:1240px;margin:auto;padding:0 32px}
    .hero{min-height:620px;color:#fff;position:relative;overflow:hidden;background:linear-gradient(120deg,rgba(7,34,50,.86),rgba(12,89,105,.52)),url('https://images.unsplash.com/photo-1500375592092-40eb2168fd21?auto=format&fit=crop&w=2000&q=85') center/cover}.hero:after{content:"";position:absolute;inset:auto -5% -1px;height:130px;background:var(--sand);border-radius:50% 50% 0 0/35% 35% 0 0}.hero .shell{position:relative;z-index:1}.nav{display:flex;justify-content:space-between;align-items:center;padding:25px 0}.brand{font-family:"Playfair Display",serif;font-size:1.2rem;letter-spacing:.06em}.nav a{color:white;text-decoration:none;font-size:.88rem;border-bottom:1px solid rgba(255,255,255,.6);padding-bottom:3px}.hero-content{padding:105px 0 150px;max-width:730px}.eyebrow{font-size:.78rem;letter-spacing:.2em;font-weight:700}.hero h1{font-size:clamp(3.4rem,9vw,7.4rem);line-height:.95;letter-spacing:.02em;margin:15px 0 22px;font-weight:800}.hero h1 em{font-family:"Playfair Display",serif;font-weight:600}.hero p{font-size:clamp(1rem,2vw,1.25rem);max-width:510px;margin:0;opacity:.93}.hero-stats{display:flex;gap:34px;margin-top:42px}.hero-stats b{display:block;font-family:"Playfair Display",serif;font-size:2rem;line-height:1}.hero-stats span{font-size:.76rem;letter-spacing:.08em;opacity:.8}
    main{padding:12px 0 94px}.intro{display:grid;grid-template-columns:1fr 2fr;gap:58px;padding:48px 0 34px;align-items:start}.section-kicker{font-size:.76rem;font-weight:800;letter-spacing:.16em;color:var(--coral)}h2{font-size:clamp(2rem,4vw,3.3rem);line-height:1.2;margin:10px 0;font-weight:800}.intro p{font-size:1.05rem;margin:30px 0 0}.filters{display:flex;gap:10px;flex-wrap:wrap;padding:18px 0 28px;border-top:1px solid var(--line)}button{font:inherit}.filter{border:1px solid var(--line);border-radius:999px;padding:9px 16px;background:transparent;color:var(--ink);cursor:pointer;font-size:.9rem;transition:.2s}.filter:hover,.filter.active{background:var(--ink);color:#fff;border-color:var(--ink)}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:18px}.story{grid-column:span 4;min-height:268px;border:1px solid var(--line);background:var(--paper);padding:25px;display:flex;flex-direction:column;position:relative;overflow:hidden;transition:transform .25s,box-shadow .25s;cursor:pointer}.story:hover{transform:translateY(-5px);box-shadow:0 18px 30px rgba(16,42,59,.11)}.story:nth-child(5n+1){grid-column:span 8;background:var(--sea);color:#fff}.story:nth-child(5n+1):after{content:"";position:absolute;width:250px;height:250px;border:32px solid var(--aqua);border-radius:50%;right:-120px;bottom:-155px;opacity:.6}.story:nth-child(5n+3){background:var(--aqua)}.story:nth-child(5n+4){background:#f4d9c9}.num{font-family:"Playfair Display",serif;font-size:1.05rem;font-style:italic;opacity:.7}.tag{font-size:.76rem;font-weight:700;letter-spacing:.1em;margin:18px 0 6px;color:var(--coral)}.story:nth-child(5n+1) .tag{color:#fff}.story h3{font-size:1.32rem;line-height:1.38;margin:0;font-weight:800;max-width:620px;position:relative;z-index:1}.read{margin-top:auto;padding-top:22px;font-size:.82rem;font-weight:700;letter-spacing:.04em}.read:after{content:' ↗';color:var(--coral);font-size:1.05rem}.empty{grid-column:1/-1;padding:45px;text-align:center;border:1px dashed var(--line)}
    dialog{border:0;padding:0;background:transparent;max-width:min(680px,calc(100% - 32px));color:var(--ink)}dialog::backdrop{background:rgba(6,23,33,.7);backdrop-filter:blur(4px)}.modal{background:var(--paper);padding:clamp(26px,6vw,52px);position:relative;box-shadow:0 20px 70px rgba(0,0,0,.3)}.close{position:absolute;right:18px;top:15px;width:38px;height:38px;border:0;background:transparent;font-size:1.8rem;cursor:pointer;color:var(--ink)}.modal .tag{margin-top:24px}.modal h3{font-size:clamp(1.7rem,4vw,2.6rem);line-height:1.3;margin:8px 40px 22px 0}.modal p{font-size:1.06rem;white-space:pre-line}.modal ul{padding-left:1.35em}.modal li{margin:8px 0}.footer{background:var(--ink);color:#fff;padding:28px 0;font-size:.85rem}.footer .shell{display:flex;justify-content:space-between;gap:20px}.footer span{opacity:.7}
    @media(max-width:760px){.shell{padding:0 20px}.hero{min-height:540px}.hero-content{padding:66px 0 135px}.hero-stats{gap:22px}.intro{grid-template-columns:1fr;gap:0;padding-top:25px}.intro p{margin-top:8px}.grid{grid-template-columns:1fr}.story,.story:nth-child(5n+1){grid-column:auto;min-height:235px}.footer .shell{display:block}.footer span{display:block;margin-top:5px}}
  </style>
</head>
<body>
  <header class="hero">
    <div class="shell">
      <nav class="nav"><div class="brand">TOUCHENG · NOTES</div><a href="#stories">探索小鎮故事 ↓</a></nav>
      <div class="hero-content"><div class="eyebrow">宜蘭 · 頭城 · 海岸生活誌</div><h1>一座靠海的<br><em>小鎮，</em>16 個故事</h1><p>從鐵道、漁港到巷口的早餐店，把頭城日常裡容易被忽略的片段，一一收進這本小小的地方誌。</p><div class="hero-stats"><div><b>07</b><span>臺鐵車站</span></div><div><b>08</b><span>沿岸漁港</span></div><div><b>16</b><span>地方小知識</span></div></div></div>
    </div>
  </header>
  <main id="stories"><div class="shell">
    <section class="intro"><div><div class="section-kicker">LOCAL FIELD NOTES</div><h2>頭城，<br>不只是一個站名。</h2></div><p>這裡有通往山海的列車、有不斷變化的街景，也有只屬於在地人的共同記憶。點選每張卡片，展開閱讀完整內容。</p></section>
    <div class="filters" aria-label="故事分類"><button class="filter active" data-filter="全部">全部故事</button><button class="filter" data-filter="地理與交通">地理與交通</button><button class="filter" data-filter="生活與日常">生活與日常</button><button class="filter" data-filter="人文與地方">人文與地方</button><button class="filter" data-filter="歷史與記憶">歷史與記憶</button></div>
    <section class="grid" id="grid"></section>
  </div></main>
  <dialog id="dialog"><article class="modal"><button class="close" aria-label="關閉">×</button><div class="num" id="modalNum"></div><div class="tag" id="modalTag"></div><h3 id="modalTitle"></h3><p id="modalContent"></p><ul id="modalList"></ul></article></dialog>
  <footer class="footer"><div class="shell"><b>TOUCHENG · NOTES</b><span>頭城小知識｜以原始資料重新編排設計</span></div></footer>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase-config.js"></script>
  <script>
    let stories=[
      ['地理與交通','七個臺鐵車站，串起頭城的海岸線','頭城從北到南有七個臺鐵車站：石城、大里、大溪、龜山、外澳、頭城、頂埔，是全台灣擁有最多車站的鄉鎮。'],
      ['生活與日常','青雲路上的二十家檳榔攤','頭城青雲路從頭城國小到頭城陸橋之間，有二十家檳榔攤。'],
      ['地理與交通','八個漁港，面向同一片太平洋','頭城從北到南有八個漁港，是全台灣擁有最多漁港的鄉鎮。',['石城','桶盤堀','大里','蕃薯寮','大溪第二漁港','大溪第一漁港','梗枋','烏石漁港']],
      ['歷史與記憶','蘭陽博物館以前，是一片果園','蘭陽博物館於 2004 年 8 月開工、2010 年 5 月試營運；這座地景建築的前身，是一大片芭樂園與柚子樹。'],
      ['歷史與記憶','香雞城曾經在這裡','1995 年前後頭城曾開過《香雞城》，地點在現在青雲路《老街懷舊食堂》的店面。'],
      ['人文與地方','頭城的青年，人才輩出','「頭城文風鼎盛，人才輩出」？不 Google 的話，能說出幾位頭城相關、40 歲以下的優秀青年呢？',['楊肅浩（唱片歌手、宜中教師）','賴志遠（出書作家、宜中教師）','連明偉（台灣當代作家）','康潤之（書法家）','李慈雲（全運會鐵餅金牌、宜中教練）','陳建嘉（富邦籃球隊、宜中教練、頭中教練）','張宗憲（富邦勇士隊、台灣噴射機）']],
      ['生活與日常','凌晨三點，還有頭城豆漿店','除了便利商店，半夜三點肚子餓的話，只有《85度C》對面的《頭城豆漿店》有開。'],
      ['生活與日常','車站 300 公尺內，超過 30 家早餐店','以頭城車站為圓心，包含便利商店，半徑 300 公尺內有超過 30 家賣早餐的店家。'],
      ['人文與地方','頭城出過三位民選縣長','頭城出過三位民選縣長：',['盧纘祥（1951–1954）','林才添（1960–1964）','呂國華（2005–2009）']],
      ['地理與交通','青雲路口，請慢一點','頭城青雲路從頭城國小到阿宗芋冰，是砂石車、大卡車最容易闖紅燈的路口，用路人請小心。'],
      ['人文與地方','2026 年的頭城：27,969 人','根據戶政資料，從 2014 年開始，頭城鎮人口即跌破三萬人；2026 年 6 月為 27,969 人，鎮公所已沒有「主祕」一缺。'],
      ['歷史與記憶','十元玩十五分鐘的小豆苗','頭城曾經有過《小豆苗》，現址已貼出租。老闆同地還開過電動玩具店，任天堂紅白機新台幣 10 元玩 15 分鐘的那種。'],
      ['生活與日常','星期五夜市的駕駛技術','逛星期五頭城夜市時，有機會可以欣賞遊覽車司機高超的駕駛技術。'],
      ['歷史與記憶','2002 年的鐵板燒店','2002 年，頭城鎮上曾經有過「鐵板燒店」，就在現在頭城商場燒餅蛋餅店店面。'],
      ['歷史與記憶','九股山上的垃圾記憶','宜蘭還沒有焚化爐前，頭城的垃圾都是掩埋在九股山上（1980–2004）。'],
      ['歷史與記憶','青雲路旁的 MTV 店','頭城曾經有過 MTV 店，就在青雲路《合記便當》旁、檳榔攤那棟大樓。']
    ].map((s,i)=>({id:i+1,tag:s[0],title:s[1],content:s[2],list:s[3]||[]}));
    const grid=document.querySelector('#grid'),dialog=document.querySelector('#dialog');
    function render(filter='全部'){const items=stories.filter(x=>filter==='全部'||x.tag===filter);grid.innerHTML=items.length?items.map(x=>`<article class="story" tabindex="0" data-id="${x.id}"><span class="num">${String(x.id).padStart(2,'0')} / 16</span><span class="tag">${x.tag}</span><h3>${x.title}</h3><span class="read">閱讀故事</span></article>`).join(''):'<div class="empty">這個分類暫時沒有故事。</div>'}
    function open(id){const x=stories.find(story=>Number(story.id)===Number(id));if(!x)return;modalNum.textContent=`${String(x.id).padStart(2,'0')} / ${stories.length}`;modalTag.textContent=x.tag;modalTitle.textContent=x.title;modalContent.textContent=x.content;modalList.innerHTML=x.list.map(i=>`<li>${i}</li>`).join('');dialog.showModal()}
    document.querySelector('.filters').addEventListener('click',e=>{if(!e.target.matches('.filter'))return;document.querySelectorAll('.filter').forEach(b=>b.classList.remove('active'));e.target.classList.add('active');render(e.target.dataset.filter)});
    grid.addEventListener('click',e=>{const card=e.target.closest('.story');if(card)open(+card.dataset.id)});grid.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.story')){e.preventDefault();open(+e.target.dataset.id)}});document.querySelector('.close').onclick=()=>dialog.close();
    async function loadStories(){
      if(!window.supabaseClient)return render();
      const {data,error}=await window.supabaseClient.from('stories').select('*').eq('is_published',true).order('sort_order');
      if(error){console.warn('無法載入雲端資料，顯示內建內容。',error.message);return render();}
      if(data?.length){stories=data.map(item=>({id:item.id,tag:item.category,title:item.title,content:item.content,list:item.list_items||[]}));}
      render();
    }
    loadStories();
  </script>
</body>
</html>
